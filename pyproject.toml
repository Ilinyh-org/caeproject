[project]

name = "caeproject"
version = "0.0.0"
description = "A module for running CAE applications from python script"

readme = "README.md"

requires-python = ">=3.12"

license-files = ["LICEN[CS]E*"]

keywords = ["cae", "script", "mechanical"]

authors = [
  {name = "Gleb Ilinyh", email = "gleb@ilinyh.ru" }
]

maintainers = [
  {name = "Gleb Ilinyh", email = "gleb@ilinyh.ru" }
]

dependencies = [
    "pint",
    "pandas"
]

[project.optional-dependencies]
dev = ["pytest", "pytest_check", "pytest-cov", "ruff"]
test = ["pytest", "plotly"]

[project.urls]
"Homepage" = "https://github.com/IlinyhGleb/caeproject"
"Bug Reports" = "https://github.com/IlinyhGleb/caeproject/issues"
"Source" = "https://github.com/IlinyhGleb/caeproject"

# ---------- PSR configuration ----------
[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
build_command = "python -m build"  # optional, but useful

[tool.semantic_release.changelog]
mode = "update"  # prepends new entries, keeps history

# ---------- setuptools ----------
[tool.setuptools.packages.find]
where = ["."]
include = ["project", "caecase", "core"]

[tool.setuptools.package-data]
caeproject = ["data/*.pm"]

[tool.pytest.ini_options]
markers = [
    "external: tests requiring third-party software",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"