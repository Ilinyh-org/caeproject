[project]

name = "caeproject"
dynamic = ["version"]

description = "A module for running CAE applications from python script"

readme = "README.md"

requires-python = ">=3.11.4"

license-files = ["LICEN[CS]E*"]

keywords = ["cae", "script", "mechanical"]

authors = [
  {name = "Gleb Ilinyh", email = "gleb@ilinyh.ru" }
]

maintainers = [
  {name = "Gleb Ilinyh", email = "gleb@ilinyh.ru" }
]

dependencies = [
    "caetask @ git+ssh://git@github.com/IlinyhGleb/caetask.git",
    "pint",
    "pandas"
]

[project.optional-dependencies] # Optional
dev = ["pytest", "pytest_check", "pytest-cov"]
test = ["pytest", "plotly"]

[project.urls]  # Optional
"Homepage" = "https://github.com/IlinyhGleb/caeproject"
"Bug Reports" = "https://github.com/IlinyhGleb/caeproject/issues"
"Source" = "https://github.com/IlinyhGleb/caeproject"

[tool.setuptools.packages.find]
where = ["."]
include = ["project", "caecase", "core"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"